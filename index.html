<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Edam — Learn Anything</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #f5f5f7;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --blue: #0071e3;
  --blue-dark: #005bb5;
  --glass: rgba(255,255,255,.63);
  --border: rgba(255,255,255,.8);
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(0,113,227,.12),
      transparent 28%
    ),

    radial-gradient(
      circle at 85% 15%,
      rgba(175,82,222,.12),
      transparent 30%
    ),

    var(--bg);

  min-height: 100vh;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.glass {
  background: var(--glass);

  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);

  border: 1px solid var(--border);

  box-shadow:
    0 20px 60px rgba(0,0,0,.07);
}

nav {
  width: min(1100px, calc(100% - 28px));

  margin: 16px auto;

  padding: 12px 18px;

  border-radius: 22px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  position: sticky;

  top: 14px;

  z-index: 20;
}

.logo {
  font-size: 21px;
  font-weight: 700;
}

nav button {
  border: 0;

  background: transparent;

  padding: 9px 13px;

  border-radius: 13px;
}

nav button:hover {
  background: rgba(0,0,0,.06);
}

main {
  width: min(1100px, calc(100% - 28px));

  margin: auto;
}

.hero {
  text-align: center;

  padding: 80px 10px 55px;
}

.hero h1 {
  margin: 0;

  font-size:
    clamp(48px, 8vw, 86px);

  line-height: .95;

  letter-spacing: -5px;
}

.hero p {
  max-width: 650px;

  margin:
    24px auto 0;

  color: var(--muted);

  font-size: 19px;

  line-height: 1.5;
}

.section {
  padding: 28px;

  border-radius: 28px;

  margin-bottom: 28px;
}

.section h2 {
  margin:
    0 0 8px;

  font-size: 28px;

  letter-spacing: -1px;
}

.muted {
  color: var(--muted);
}

.form {
  display: grid;

  gap: 14px;

  margin-top: 20px;
}

input,
select,
textarea {
  width: 100%;

  border: 1px solid rgba(0,0,0,.08);

  background:
    rgba(255,255,255,.75);

  padding: 15px;

  border-radius: 16px;

  outline: none;
}

textarea {
  min-height: 110px;

  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  border-color:
    rgba(0,113,227,.4);

  box-shadow:
    0 0 0 4px
    rgba(0,113,227,.08);
}

.primary {
  border: 0;

  border-radius: 16px;

  padding: 15px 20px;

  background: var(--blue);

  color: white;

  font-weight: 600;
}

.primary:hover {
  background: var(--blue-dark);
}

.primary:disabled {
  opacity: .55;

  cursor: wait;
}

.status {
  color: var(--muted);

  min-height: 20px;

  font-size: 14px;
}

.course-header {
  padding: 28px;

  border-radius: 26px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.8),
      rgba(255,255,255,.42)
    );

  border:
    1px solid rgba(255,255,255,.8);
}

.course-header h2 {
  font-size: 38px;

  margin: 0 0 10px;

  letter-spacing: -1.5px;
}

.badge {
  display: inline-block;

  padding: 7px 11px;

  border-radius: 999px;

  background: rgba(0,113,227,.1);

  color: var(--blue);

  font-size: 12px;

  font-weight: 600;
}

.outcomes {
  margin-top: 22px;

  display: grid;

  gap: 8px;
}

.outcome {
  padding: 12px 14px;

  background:
    rgba(255,255,255,.5);

  border-radius: 14px;
}

.unit {
  margin-top: 16px;

  padding: 20px;

  border-radius: 22px;

  background:
    rgba(255,255,255,.48);

  border:
    1px solid rgba(255,255,255,.7);
}

.unit h3 {
  margin: 0;

  font-size: 21px;
}

.unit-description {
  color: var(--muted);

  font-size: 14px;

  line-height: 1.5;

  margin:
    7px 0 15px;
}

.lessons {
  display: grid;

  gap: 9px;
}

.lesson-button {
  width: 100%;

  border: 0;

  text-align: left;

  padding: 15px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.7);

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.lesson-button:hover {
  background:
    rgba(255,255,255,.95);

  transform: translateY(-1px);
}

.lesson-main {
  display: flex;

  gap: 12px;

  align-items: center;
}

.lesson-number {
  width: 32px;

  height: 32px;

  border-radius: 50%;

  display: grid;

  place-items: center;

  background:
    rgba(0,113,227,.1);

  color: var(--blue);

  font-size: 13px;

  font-weight: 600;
}

.lesson-name {
  font-weight: 600;
}

.lesson-summary {
  color: var(--muted);

  font-size: 12px;

  margin-top: 3px;
}

.completed {
  color: #16803c;

  font-size: 18px;
}

.empty {
  color: var(--muted);

  padding: 10px 0;
}

.modal {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  padding: 20px;

  background:
    rgba(0,0,0,.35);

  backdrop-filter: blur(12px);

  overflow-y: auto;
}

.modal.show {
  display: block;
}

.modal-card {
  width: min(850px, 100%);

  margin:
    30px auto;

  padding: 28px;

  border-radius: 28px;

  background:
    rgba(250,250,252,.9);

  backdrop-filter: blur(30px);

  box-shadow:
    0 30px 100px rgba(0,0,0,.2);
}

.modal-top {
  display: flex;

  justify-content: space-between;

  gap: 20px;
}

.close {
  border: 0;

  width: 38px;

  height: 38px;

  border-radius: 50%;

  background:
    rgba(0,0,0,.07);

  font-size: 20px;
}

.lesson-title {
  font-size: 34px;

  margin: 0 0 8px;

  letter-spacing: -1px;
}

.objective {
  color: var(--muted);

  line-height: 1.6;

  margin-bottom: 25px;
}

.learning-section {
  margin:
    28px 0;
}

.learning-section h3 {
  font-size: 21px;

  margin-bottom: 8px;
}

.learning-section p {
  line-height: 1.75;
}

.example {
  padding: 14px 16px;

  margin:
    8px 0;

  border-left:
    4px solid var(--blue);

  border-radius: 12px;

  background:
    rgba(0,113,227,.06);
}

.practice {
  margin-top: 35px;

  padding-top: 25px;

  border-top:
    1px solid rgba(0,0,0,.08);
}

.question {
  padding: 20px;

  margin-top: 14px;

  border-radius: 20px;

  background:
    rgba(255,255,255,.72);
}

.question-text {
  font-weight: 600;

  line-height: 1.5;
}

.options {
  display: grid;

  gap: 8px;

  margin-top: 13px;
}

.option {
  border:
    1px solid rgba(0,0,0,.08);

  background:
    rgba(255,255,255,.8);

  padding: 12px 14px;

  border-radius: 13px;

  text-align: left;
}

.option:hover {
  border-color:
    rgba(0,113,227,.3);
}

.option.correct {
  background:
    rgba(52,199,89,.13);

  border-color:
    rgba(52,199,89,.4);
}

.option.wrong {
  background:
    rgba(255,59,48,.1);

  border-color:
    rgba(255,59,48,.35);
}

.feedback {
  margin-top: 10px;

  color: var(--muted);

  line-height: 1.5;
}

.complete {
  margin-top: 28px;

  width: 100%;
}

.progress {
  margin-top: 20px;
}

.progress-bar {
  height: 9px;

  border-radius: 99px;

  overflow: hidden;

  background:
    rgba(0,0,0,.07);
}

.progress-fill {
  height: 100%;

  width: 0%;

  background: var(--blue);

  transition: width .3s ease;
}

.progress-text {
  margin-top: 6px;

  color: var(--muted);

  font-size: 13px;
}

.loader {
  padding: 30px;

  text-align: center;

  color: var(--muted);
}

@media (max-width: 700px) {

  nav {
    top: 8px;
  }

  .hero {
    padding-top: 60px;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  .section {
    padding: 20px;
  }

  .lesson-title {
    font-size: 28px;
  }

  .modal {
    padding: 8px;
  }

  .modal-card {
    margin:
      10px auto;

    padding: 20px;
  }
}

</style>

</head>


<body>


<nav class="glass">

  <div class="logo">
    Edam
  </div>

  <div>
    <button onclick="goToCreate()">
      Create Course
    </button>
  </div>

</nav>


<main>


<section class="hero">

  <h1>
    Learn anything.
  </h1>

  <p>
    Build a course, learn one lesson at a time,
    practice what you learn, and track your progress.
  </p>

</section>


<section
  id="createSection"
  class="section glass"
>

  <h2>
    Create a Course
  </h2>

  <p class="muted">
    Gemini will create the learning structure.
    Lessons are generated when you open them.
  </p>


  <div class="form">

    <input
      id="courseName"
      placeholder="What do you want to learn?"
    >


    <select id="level">

      <option value="">
        Choose your level
      </option>

      <option>
        Beginner
      </option>

      <option>
        Elementary
      </option>

      <option>
        Intermediate
      </option>

      <option>
        Advanced
      </option>

      <option>
        University
      </option>

      <option>
        Professional
      </option>

    </select>


    <textarea
      id="goal"
      placeholder="What do you want to achieve?"
    ></textarea>


    <button
      id="generateBtn"
      class="primary"
      onclick="createCourse()"
    >
      Create with Gemini
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>

</section>


<section
  id="courseSection"
  class="section glass"
  style="display:none"
>

  <div id="courseContent"></div>

</section>


</main>


<div
  id="lessonModal"
  class="modal"
>

  <div class="modal-card">

    <div class="modal-top">

      <div>
        <h2
          id="lessonTitle"
          class="lesson-title"
        ></h2>

        <div
          id="lessonObjective"
          class="objective"
        ></div>
      </div>

      <button
        class="close"
        onclick="closeLesson()"
      >
        ×
      </button>

    </div>


    <div
      id="lessonContent"
    ></div>


    <button
      id="completeLesson"
      class="primary complete"
      onclick="completeCurrentLesson()"
      style="display:none"
    >
      Mark Lesson Complete
    </button>

  </div>

</div>


<script>

const WORKER_URL =
  "https://edam-ai.rup62012.workers.dev/";


let currentCourse = null;

let currentLesson = null;

let currentUnitId = null;

let currentLessonId = null;


function goToCreate() {

  document
    .getElementById("createSection")
    .scrollIntoView({
      behavior: "smooth"
    });

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


async function callWorker(action, prompt) {

  const response =
    await fetch(
      WORKER_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          action,
          prompt
        })
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data?.error ||
      "AI request failed."
    );

  }


  if (!data?.text) {

    throw new Error(
      "Gemini returned no content."
    );

  }


  return JSON.parse(data.text);

}


async function createCourse() {

  const name =
    document
      .getElementById("courseName")
      .value
      .trim();


  const level =
    document
      .getElementById("level")
      .value;


  const goal =
    document
      .getElementById("goal")
      .value
      .trim();


  const button =
    document
      .getElementById("generateBtn");


  const status =
    document
      .getElementById("status");


  if (!name || !level || !goal) {

    status.textContent =
      "Fill in the course, level and goal.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Building your course...";

  status.textContent =
    "Gemini is designing your learning path...";


  const prompt = `

You are Edam, an educational AI teacher.

Create a structured learning course.

Course:
${name}

Level:
${level}

Goal:
${goal}

Return ONLY data matching the requested JSON schema.

Create 5 to 8 units.

Each unit must contain 3 to 5 lessons.

The course should progress from easier ideas
to harder ideas.

For English and language courses, include:
vocabulary, grammar, reading, writing,
listening, pronunciation and communication
where appropriate.

Do not invent fake textbooks,
authors, institutions or citations.

The response will be rendered by an
interactive learning application.

Do NOT write markdown.

`;


  try {

    currentCourse =
      await callWorker(
        "course",
        prompt
      );


    currentCourse.completed =
      loadProgress();


    localStorage.setItem(
      "edamCourse",
      JSON.stringify(currentCourse)
    );


    renderCourse();


    document
      .getElementById("courseSection")
      .style.display = "block";


    document
      .getElementById("courseSection")
      .scrollIntoView({
        behavior: "smooth"
      });


    status.textContent =
      "Course created.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Something went wrong: " +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "Create with Gemini";

  }

}


function renderCourse() {

  if (!currentCourse) {
    return;
  }


  const section =
    document
      .getElementById("courseSection");


  section.style.display =
    "block";


  let completed =
    loadProgress();


  currentCourse.completed =
    completed;


  let totalLessons = 0;

  let completedLessons = 0;


  currentCourse.units.forEach(
    unit => {

      unit.lessons.forEach(
        lesson => {

          totalLessons++;

          if (
            completed.includes(
              lesson.id
            )
          ) {

            completedLessons++;

          }

        }
      );

    }
  );


  const percentage =
    totalLessons === 0
      ? 0
      : Math.round(
          completedLessons /
          totalLessons *
          100
        );


  let html = `

    <div class="course-header">

      <span class="badge">
        ${escapeHtml(
          currentCourse.level
        )}
      </span>

      <h2>
        ${escapeHtml(
          currentCourse.title
        )}
      </h2>

      <p class="muted">
        ${escapeHtml(
          currentCourse.description
        )}
      </p>

      <div class="progress">

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${percentage}%"
          ></div>

        </div>

        <div class="progress-text">
          ${completedLessons}
          of
          ${totalLessons}
          lessons complete ·
          ${percentage}%
        </div>

      </div>


      <div class="outcomes">

        ${
          currentCourse.outcomes
            .map(
              outcome => `
                <div class="outcome">
                  ✓ ${escapeHtml(
                    outcome
                  )}
                </div>
              `
            )
            .join("")
        }

      </div>

    </div>

  `;


  currentCourse.units.forEach(
    (unit, unitIndex) => {

      html += `

        <div class="unit">

          <h3>
            Unit ${unitIndex + 1} ·
            ${escapeHtml(
              unit.title
            )}
          </h3>

          <div
            class="unit-description"
          >
            ${escapeHtml(
              unit.description
            )}
          </div>

          <div class="lessons">

      `;


      unit.lessons.forEach(
        (lesson, lessonIndex) => {

          const isComplete =
            completed.includes(
              lesson.id
            );


          html += `

            <button
              class="lesson-button"
              onclick="
                openLesson(
                  '${escapeJs(unit.id)}',
                  '${escapeJs(lesson.id)}'
                )
              "
            >

              <div class="lesson-main">

                <div
                  class="lesson-number"
                >
                  ${lessonIndex + 1}
                </div>

                <div>

                  <div
                    class="lesson-name"
                  >
                    ${escapeHtml(
                      lesson.title
                    )}
                  </div>

                  <div
                    class="lesson-summary"
                  >
                    ${escapeHtml(
                      lesson.summary
                    )}
                  </div>

                </div>

              </div>

              <div>

                ${
                  isComplete
                    ? `<span class="completed">✓</span>`
                    : "›"
                }

              </div>

            </button>

          `;

        }
      );


      html += `

          </div>

        </div>

      `;

    }
  );


  document
    .getElementById(
      "courseContent"
    )
    .innerHTML = html;

}


function escapeJs(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");

}


async function openLesson(
  unitId,
  lessonId
) {

  if (!currentCourse) {
    return;
  }


  const unit =
    currentCourse.units.find(
      u => u.id === unitId
    );


  if (!unit) {
    return;
  }


  const lesson =
    unit.lessons.find(
      l => l.id === lessonId
    );


  if (!lesson) {
    return;
  }


  currentUnitId =
    unitId;

  currentLessonId =
    lessonId;


  document
    .getElementById("lessonTitle")
    .textContent =
      lesson.title;


  document
    .getElementById("lessonObjective")
    .textContent =
      "Loading lesson...";


  document
    .getElementById("lessonContent")
    .innerHTML =
      `<div class="loader">
        Gemini is preparing your lesson...
      </div>`;


  document
    .getElementById("lessonModal")
    .classList.add("show");


  document.body.style.overflow =
    "hidden";


  try {

    const prompt = `

You are Edam, an educational AI teacher.

Teach this specific lesson.

Course:
${currentCourse.title}

Course level:
${currentCourse.level}

Course goal:
${currentCourse.goal}

Unit:
${unit.title}

Unit description:
${unit.description}

Lesson:
${lesson.title}

Lesson summary:
${lesson.summary}

Create a real teaching lesson, not an outline.

The lesson must contain:

- A clear objective
- Several explanation sections
- Useful examples
- A short practice activity
- 4 multiple-choice questions
- Explanations for every answer
- A concise lesson summary

The questions must actually test what
the lesson teaches.

For English learning, use accurate grammar,
vocabulary and natural examples.

Return ONLY the requested JSON.

Do not return markdown.

`;


    currentLesson =
      await callWorker(
        "lesson",
        prompt
      );


    renderLesson();


  } catch (error) {

    document
      .getElementById(
        "lessonContent"
      )
      .innerHTML = `

        <p>
          Could not load this lesson.
        </p>

        <p class="muted">
          ${escapeHtml(
            error.message
          )}
        </p>

      `;

  }

}


function renderLesson() {

  if (!currentLesson) {
    return;
  }


  document
    .getElementById("lessonTitle")
    .textContent =
      currentLesson.title;


  document
    .getElementById("lessonObjective")
    .textContent =
      currentLesson.objective;


  let html = "";


  currentLesson.sections.forEach(
    section => {

      html += `

        <div class="learning-section">

          <h3>
            ${escapeHtml(
              section.heading
            )}
          </h3>

          <p>
            ${escapeHtml(
              section.text
            )}
          </p>

          ${
            section.examples
              .map(
                example => `
                  <div class="example">
                    ${escapeHtml(
                      example
                    )}
                  </div>
                `
              )
              .join("")
          }

        </div>

      `;

    }
  );


  html += `

    <div class="practice">

      <h3>
        Practice
      </h3>

  `;


  currentLesson.practice.forEach(
    (question, index) => {

      html += `

        <div
          class="question"
          id="question-${index}"
        >

          <div class="question-text">

            ${index + 1}.
            ${escapeHtml(
              question.question
            )}

          </div>

          <div class="options">

      `;


      question.options.forEach(
        (option, optionIndex) => {

          html += `

            <button
              class="option"
              onclick="
                answerQuestion(
                  ${index},
                  ${optionIndex}
                )
              "
            >
              ${escapeHtml(
                option
              )}
            </button>

          `;

        }
      );


      html += `

          </div>

          <div
            class="feedback"
            id="feedback-${index}"
          ></div>

        </div>

      `;

    }
  );


  html += `

      <div class="learning-section">

        <h3>
          Lesson summary
        </h3>

        <p>
          ${escapeHtml(
            currentLesson.summary
          )}
        </p>

      </div>

    </div>

  `;


  document
    .getElementById(
      "lessonContent"
    )
    .innerHTML = html;


  document
    .getElementById(
      "completeLesson"
    )
    .style.display =
      "block";


  const completed =
    loadProgress();


  if (
    completed.includes(
      currentLessonId
    )
  ) {

    document
      .getElementById(
        "completeLesson"
      )
      .textContent =
        "Lesson Completed ✓";

  } else {

    document
      .getElementById(
        "completeLesson"
      )
      .textContent =
        "Mark Lesson Complete";

  }

}


function answerQuestion(
  questionIndex,
  optionIndex
) {

  const question =
    currentLesson.practice[
      questionIndex
    ];


  const container =
    document.getElementById(
      `question-${questionIndex}`
    );


  const buttons =
    container.querySelectorAll(
      ".option"
    );


  buttons.forEach(
    button => {
      button.disabled = true;
    }
  );


  const correct =
    optionIndex ===
    question.answerIndex;


  buttons.forEach(
    (button, index) => {

      if (
        index ===
        question.answerIndex
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  if (!correct) {

    buttons[optionIndex]
      .classList.add(
        "wrong"
      );

  }


  const feedback =
    document.getElementById(
      `feedback-${questionIndex}`
    );


  feedback.textContent =
    correct
      ? "Correct! " +
        question.explanation
      : "Not quite. " +
        question.explanation;

}


function completeCurrentLesson() {

  if (!currentLessonId) {
    return;
  }


  let completed =
    loadProgress();


  if (
    !completed.includes(
      currentLessonId
    )
  ) {

    completed.push(
      currentLessonId
    );

  }


  localStorage.setItem(
    "edamProgress",
    JSON.stringify(
      completed
    )
  );


  document
    .getElementById(
      "completeLesson"
    )
    .textContent =
      "Lesson Completed ✓";


  renderCourse();

}


function loadProgress() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          "edamProgress"
        ) || "[]"
      );


    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function closeLesson() {

  document
    .getElementById(
      "lessonModal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";

}


const savedCourse =
  localStorage.getItem(
    "edamCourse"
  );


if (savedCourse) {

  try {

    currentCourse =
      JSON.parse(
        savedCourse
      );


    renderCourse();

  } catch {

    localStorage.removeItem(
      "edamCourse"
    );

  }

}

</script>
